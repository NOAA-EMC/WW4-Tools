name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  cpp-tests:
    name: C++ (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure

  python-tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run Tests
        run: |
          # pytest exit code 5 means "no tests collected", which is acceptable until tests exist.
          pytest || [ $? -eq 5 ]
