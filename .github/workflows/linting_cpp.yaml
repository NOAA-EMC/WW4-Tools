name: Lint and Format
on: [pull_request, push]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Clang-Format and Cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck

    - name: Run Clang-Format Check
      run: |
        find src tests \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -print0 2>/dev/null \
          | xargs -0 -r clang-format --dry-run --Werror

    - name: Run Cppcheck
      run: |
        if [ -d src ]; then
          cppcheck --enable=all --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=unusedFunction --suppress=missingInclude -I src --error-exitcode=1 src
        fi
