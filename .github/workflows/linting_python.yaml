name: Python Linting
on: [pull_request, push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff lint
      run: ruff check .

    - name: Run Ruff format check
      run: ruff format --check .
