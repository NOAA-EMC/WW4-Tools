# Python tooling configuration for WW4-Tools (Ruff and pytest).
# Docstrings follow the NumPy convention (see AGENTS.md).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["externals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
